# Límite de peticiones por equipo (IP): evita pedidos basura en masa y ataques al PIN
limit_req_zone $binary_remote_addr zone=pedidos:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=acciones:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ingreso:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # DNS interno de Docker: si n8n se reinicia y cambia de IP, nginx la vuelve a resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $n8n http://n8n:5678;

    # Este archivo de configuración no se publica
    location = /nginx.conf { return 404; }

    # Las páginas son del mismo origen: no se permite que otras páginas web llamen a la API
    location /api/ {
        if ($request_method = OPTIONS) { return 403; }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        limit_req zone=acciones burst=40 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /webhook/$1 break;
        proxy_pass $n8n;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Crear pedidos: máximo ~12 por minuto por equipo (la caja hace pocos por minuto)
    location = /api/pedido {
        if ($request_method = OPTIONS) { return 403; }
        proxy_hide_header Access-Control-Allow-Origin;
        limit_req zone=pedidos burst=20 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /webhook/$1 break;
        proxy_pass $n8n;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Ingreso con PIN: máximo ~10 intentos por minuto por equipo
    location = /api/ingreso {
        if ($request_method = OPTIONS) { return 403; }
        proxy_hide_header Access-Control-Allow-Origin;
        limit_req zone=ingreso burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /webhook/$1 break;
        proxy_pass $n8n;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
    }
}
