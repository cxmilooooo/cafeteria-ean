# Límite de peticiones por equipo (IP): evita pedidos basura en masa y ataques al PIN
limit_req_zone $binary_remote_addr zone=pedidos:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=acciones:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ingreso:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # DNS interno de Docker: si n8n se reinicia y cambia de IP, nginx la vuelve a resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $n8n http://n8n:5678;

    location = /nginx.conf { return 404; }

    # =====================================================================
    # PÚBLICO (clientes con el QR): solo ver el menú, pedir y seguir su pedido
    # =====================================================================
    location = /api/catalogo {
        limit_req zone=acciones burst=40 nodelay;
        limit_req_status 429;
        proxy_set_header X-Personal "";          # el menú público no incluye al personal
        rewrite ^/api/(.*)$ /webhook/$1 break;
        proxy_pass $n8n;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location = /api/pedido {
        if ($request_method = OPTIONS) { return 403; }
        limit_req zone=pedidos burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header X-Personal "";
        rewrite ^/api/(.*)$ /webhook/$1 break;
        proxy_pass $n8n;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location = /api/seguimiento {
        limit_req zone=acciones burst=40 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /webhook/$1 break;
        proxy_pass $n8n;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    # Cualquier otra acción no existe para el público
    location /api/ { return 404; }

    # =====================================================================
    # PERSONAL: pantallas y API protegidas con la clave del local
    # (el navegador de cada equipo del personal la pide una vez y la recuerda)
    # =====================================================================
    location ^~ /personal/ {
        auth_basic "Personal de la cafeteria";
        auth_basic_user_file /etc/nginx/personal.htpasswd;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /personal/api/ingreso {
        auth_basic "Personal de la cafeteria";
        auth_basic_user_file /etc/nginx/personal.htpasswd;
        limit_req zone=ingreso burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Authorization "";
        rewrite ^/personal/api/(.*)$ /webhook/$1 break;
        proxy_pass $n8n;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location ^~ /personal/api/ {
        if ($request_method = OPTIONS) { return 403; }
        auth_basic "Personal de la cafeteria";
        auth_basic_user_file /etc/nginx/personal.htpasswd;
        limit_req zone=acciones burst=40 nodelay;
        limit_req_status 429;
        proxy_set_header Authorization "";
        proxy_set_header X-Personal "si";        # el catálogo incluye la lista de personal
        rewrite ^/personal/api/(.*)$ /webhook/$1 break;
        proxy_pass $n8n;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_read_timeout 30s;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
    }
}
