<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caja · Cafetería EAN</title>
<link rel="stylesheet" href="estilos.css">
<style>
  header.barra { padding: 8px 16px; }
  header.barra h1 { min-width: 0; }
  main { max-width: 1400px; padding: 12px 16px; }
  .extra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Pedidos del QR por cobrar */
  .por-cobrar { margin-bottom: 12px; }
  .por-cobrar h2 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .por-cobrar.vacia { padding: 8px 14px; }
  .por-cobrar.vacia h2 { margin: 0; font-size: .95rem; color: var(--texto-suave); font-weight: 500; }
  .por-cobrar.con-pedidos { border: 2px solid var(--alerta); }
  .n-pend { background: var(--alerta); color: #fff; border-radius: 99px; padding: 1px 10px; font-size: .9rem; }
  @media (prefers-color-scheme: dark) { .n-pend { color: #1d1d1b; } }
  .tira { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
  .qr { flex: 0 0 250px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 4px;
        background: var(--fondo); border: 1px solid var(--borde); border-radius: 12px; padding: 10px 12px; }
  .qr .cab { display: flex; align-items: baseline; gap: 8px; }
  .qr .num { font-size: 1.8rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .qr .quien { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qr .items { font-size: .85rem; color: var(--texto-suave); flex: 1; }
  .qr .nota { font-size: .8rem; }
  .qr button { width: 100%; margin-top: 4px; }

  /* Pedido nuevo */
  .zona { display: grid; gap: 14px; grid-template-columns: 1fr 340px; align-items: start; }
  .menu .categoria { margin: 10px 0 6px; }
  .menu .categoria:first-child { margin-top: 0; }
  .prods { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .prod { position: relative; min-height: 66px; text-align: left; display: flex; flex-direction: column; justify-content: center;
          padding: 8px 12px; border-radius: 12px; border-width: 2px; touch-action: manipulation; user-select: none; }
  .prod .n { font-weight: 600; line-height: 1.2; }
  .prod .p { font-size: .85rem; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .prod.elegido { border-color: var(--acento); background: var(--acento-suave); }
  .prod .cuenta { position: absolute; top: -8px; right: -6px; min-width: 28px; height: 28px; border-radius: 14px; padding: 0 6px;
                  background: var(--acento); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  @media (prefers-color-scheme: dark) { .prod .cuenta { color: #0d1a14; } }
  .prod:active { transform: scale(.97); }

  .resumen { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 8px; }
  .resumen h2 { display: flex; gap: 8px; align-items: center; margin: 0; min-height: 44px; }
  .resumen h2 .enlace { font-size: .9rem; font-weight: 400; }
  .lineas { max-height: 38vh; overflow-y: auto; }
  .linea { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--borde); }
  .linea .nombre { flex: 1; }
  .linea .precio { font-variant-numeric: tabular-nums; color: var(--texto-suave); font-size: .9rem; }
  .linea button { width: 44px; padding: 0; font-size: 1.3rem; }
  .resumen label { margin: 4px 0 0; }
  .resumen input { font-size: 1.1rem; padding: 10px 12px; }
  .resumen input.falta { border-color: var(--peligro); outline: 2px solid var(--peligro); }
  #btn-cobrar { width: 100%; font-size: 1.35rem; min-height: 60px; }
  .resumen .mensaje { margin: 0; }

  @media (max-width: 820px) {
    .zona { grid-template-columns: 1fr; }
    .resumen { position: sticky; top: auto; bottom: 0; z-index: 4; margin: 0 -16px -12px; border-radius: 14px 14px 0 0;
               box-shadow: 0 -4px 16px rgba(0,0,0,.12); padding: 10px 16px 12px; }
    .lineas { max-height: 18vh; }
    .resumen h2 { font-size: .95rem; }
    .cobro-fila { display: flex; gap: 8px; }
    .cobro-fila input { flex: 1; min-width: 0; }
    #btn-cobrar { width: auto; flex: 0 0 auto; font-size: 1.1rem; min-height: 50px; }
    .resumen label { display: none; }
    .prods { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .qr { flex-basis: 230px; }
  }
</style>
</head>
<body>
<header class="barra">
  <h1>🧾 Caja</h1>
  <div class="extra">
    <button class="secundario" id="btn-se-va" title="El cliente estaba en la fila y se fue sin pedir">🚶 Se fue sin pedir</button>
    <button class="secundario" id="btn-reclamo">⚠️ Reclamo</button>
  </div>
  <select id="sel-caf" style="width:auto" aria-label="Cafetería"></select>
  <span class="usuario" id="usuario"></span>
</header>
<main>
  <section class="tarjeta por-cobrar vacia" id="sec-qr" aria-live="polite">
    <h2>Pedidos del QR por cobrar <span id="n-pend"></span></h2>
    <div class="tira" id="pendientes"></div>
  </section>

  <div class="zona">
    <section class="tarjeta menu" id="menu" aria-label="Productos"><p class="suave">Cargando menú…</p></section>

    <aside class="tarjeta resumen" aria-label="Pedido actual">
      <h2>Pedido nuevo <span class="suave" id="cronometro"></span><span style="flex:1"></span><button class="enlace oculto" id="btn-limpiar">Vaciar</button></h2>
      <div class="lineas" id="carrito"></div>
      <label for="nombre-caja">Nombre del cliente (sale en la pantalla de turnos)</label>
      <div class="cobro-fila">
        <input id="nombre-caja" maxlength="80" placeholder="Nombre del cliente" autocomplete="off" enterkeyhint="go">
        <button class="primario" id="btn-cobrar" disabled>Cobrar</button>
      </div>
      <div id="msg-pedido" class="mensaje oculto"></div>
    </aside>
  </div>
</main>

<script src="comun.js"></script>
<script>
let idCaf = parametro('cafeteria', '1');
let productos = [], carrito = {}, llegada = null, sesion = null;
let pendientesVistos = null, ultimoHtmlPend = '';
const MEDIOS = [['Efectivo', '💵'], ['Tarjeta', '💳'], ['Transferencia', '📲']];

// Cada acción viaja con el empleado y su PIN; la base de datos los vuelve a validar
const firma = () => ({ id_cajero: sesion.id_empleado, pin: sesion.pin });
const llamar = async (ruta, datos) => revisarSesion(await api(ruta, datos), 'caja', idCaf);
const producto = id => productos.find(x => x.id_producto == id);

// El tiempo en fila (RF-10) empieza al tocar el primer producto
const segundosEspera = () => llegada ? Math.round((Date.now() - llegada) / 1000) : 0;
const reloj = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
setInterval(() => { $('#cronometro').textContent = llegada ? `⏱ ${reloj(segundosEspera())}` : ''; }, 1000);

const totalCarrito = () => Object.entries(carrito).reduce((s, [id, c]) => s + c * producto(id).precio, 0);

function pintarMenu() {
  const g = agruparPorCategoria(productos.filter(p => p.disponible));
  $('#menu').innerHTML = Object.entries(g).map(([cat, ps]) => `<div class="categoria">${esc(cat)}</div>
    <div class="prods">${ps.map(p => {
      const c = carrito[p.id_producto] || 0;
      return `<button class="prod ${c ? 'elegido' : ''}" data-add="${p.id_producto}" aria-label="${esc(p.nombre)}, ${pesos(p.precio)}${c ? `, ${c} en el pedido` : ''}">
        <span class="n">${esc(p.nombre)}</span><span class="p">${pesos(p.precio)}</span>
        ${c ? `<span class="cuenta">${c}</span>` : ''}</button>`;
    }).join('')}</div>`).join('') || '<p class="suave">No hay productos disponibles.</p>';
}

function pintarResumen() {
  const lineas = Object.entries(carrito);
  $('#carrito').innerHTML = lineas.length ? lineas.map(([id, c]) => {
    const p = producto(id);
    return `<div class="linea"><div class="nombre"><strong>${c}</strong> × ${esc(p.nombre)}</div>
      <div class="precio">${pesos(c * p.precio)}</div><button data-quitar="${id}" aria-label="Quitar un ${esc(p.nombre)}">−</button></div>`;
  }).join('') : '<p class="suave" style="margin:4px 0">Toca los productos para agregarlos.</p>';
  const total = totalCarrito();
  $('#btn-cobrar').textContent = lineas.length ? `Cobrar ${pesos(total)}` : 'Cobrar';
  $('#btn-cobrar').disabled = !lineas.length || !sesion;
  $('#btn-limpiar').classList.toggle('oculto', !lineas.length);
}
function pintar() { pintarMenu(); pintarResumen(); }

document.body.addEventListener('click', e => {
  const add = e.target.closest('[data-add]'), quitar = e.target.closest('[data-quitar]');
  if (add) {
    const id = add.dataset.add;
    if (!llegada) llegada = Date.now();
    carrito[id] = Math.min(20, (carrito[id] || 0) + 1);
    $('#msg-pedido').classList.add('oculto');
    pintar();
  }
  if (quitar) {
    const id = quitar.dataset.quitar;
    carrito[id]--; if (!carrito[id]) delete carrito[id];
    if (!Object.keys(carrito).length) llegada = null;
    pintar();
  }
});

function limpiar() { carrito = {}; llegada = null; $('#nombre-caja').value = ''; $('#nombre-caja').classList.remove('falta'); pintar(); }
$('#btn-limpiar').onclick = limpiar;
$('#nombre-caja').oninput = e => e.target.classList.remove('falta');

// ---------------------------------------------------------------------
// Diálogo de cobro: 3 botones grandes. «accion(medio)» hace las llamadas
// y devuelve {ok, mensaje}; si falla, el error se ve dentro del diálogo.
// ---------------------------------------------------------------------
function dialogoCobro({ titulo, detalle, total, items }, accion) {
  const d = abrirDialogo(`
    <div class="suave">${detalle}</div>
    <h2>Cobrar ${pesos(total)}</h2>
    <ul>${items}</ul>
    <div class="medios">${MEDIOS.map(([m, ic]) => `<button class="primario" data-medio="${m}"><span aria-hidden="true">${ic}</span>${m}</button>`).join('')}</div>
    <div class="mensaje error oculto" id="msg-cobro"></div>
    <div class="pie-dialogo"><span class="suave">${titulo}</span><button data-cerrar>Cancelar</button></div>`);
  d.querySelector('[data-cerrar]').onclick = () => d.close();
  d.querySelectorAll('[data-medio]').forEach(b => b.onclick = async () => {
    const botones = d.querySelectorAll('button');
    botones.forEach(x => x.disabled = true);
    d.dataset.ocupado = '1';
    const textoOriginal = b.innerHTML;
    b.innerHTML = `<span aria-hidden="true">⏳</span>Cobrando…`;
    const r = await accion(b.dataset.medio);
    delete d.dataset.ocupado;
    if (r.ok) { d.close(); return; }
    b.innerHTML = textoOriginal;
    botones.forEach(x => x.disabled = false);
    mostrarMensaje(d.querySelector('#msg-cobro'), r.mensaje);
  });
}

const listaItems = items => items.map(i => `<li>${i.cantidad} × ${esc(i.producto)}${i.observaciones ? ` <span class="nota">(${esc(i.observaciones)})</span>` : ''}</li>`).join('');

// Pedido hecho en caja: registrar + autorizar en un solo paso
// Recarga precios y disponibilidad (por si el coordinador cambió algo)
async function refrescarMenu() {
  try {
    const cat = await cargarCatalogo(idCaf);
    productos = cat.productos;
    for (const id of Object.keys(carrito)) {          // quita del carrito lo que se agotó
      const p = producto(id);
      if (!p || !p.disponible) { delete carrito[id]; aviso(`${p ? p.nombre : 'Un producto'} se agotó y se quitó del pedido`, 'error', 4000); }
    }
    if (!hayDialogoAbierto()) pintar();
  } catch (e) { /* sin conexión: se mantiene el menú anterior */ }
}
setInterval(refrescarMenu, 60000);

$('#btn-cobrar').onclick = async () => {
  if (!sesion || !Object.keys(carrito).length) return;
  await refrescarMenu();
  if (!Object.keys(carrito).length) return;
  const nombre = $('#nombre-caja').value.trim();
  if (!nombre) {
    $('#nombre-caja').classList.add('falta'); $('#nombre-caja').focus();
    return mostrarMensaje($('#msg-pedido'), 'Escribe el nombre del cliente: se muestra en la pantalla de turnos.');
  }
  $('#msg-pedido').classList.add('oculto');
  const items = Object.entries(carrito).map(([id, c]) => ({ id_producto: Number(id), cantidad: c }));
  const espera = segundosEspera();
  let creado = null;   // si el pedido ya se registró y solo falló el cobro, no se vuelve a crear
  dialogoCobro({
    titulo: 'Pasa directo a cocina', detalle: `Pedido en caja · <strong>${esc(nombre)}</strong>`, total: totalCarrito(),
    items: listaItems(items.map(i => ({ cantidad: i.cantidad, producto: producto(i.id_producto).nombre })))
  }, async medio => {
    if (!creado) {
      const r = await llamar('pedido', {
        id_cafeteria: Number(idCaf), canal: 'Caja', ...firma(), segundos_espera: espera,
        cliente: { nombre, tipo_cliente: 'Otro', autoriza_datos: false },
        items: items.map(i => ({ ...i, observaciones: '' }))
      });
      if (!r.ok) return r;
      creado = r;
      limpiar();          // el carrito ya quedó guardado en el sistema
    }
    const a = await llamar('autorizar', { id_pedido: creado.id_pedido, medio_pago: medio, ...firma() });
    if (!a.ok) { cargarPendientes(); return { ok: false, mensaje: `Turno ${creado.numero_turno} registrado, pero no se pudo cobrar: ${a.mensaje}` }; }
    aviso(`Turno ${a.numero_turno ?? creado.numero_turno} · ${a.cliente ?? nombre} → enviado a cocina`);
    cargarPendientes();
    return a;
  });
};
$('#nombre-caja').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-cobrar').click(); });

// ---------------------------------------------------------------------
// Pedidos del QR por cobrar
// ---------------------------------------------------------------------
let pendientes = [];
async function cargarPendientes() {
  if (hayDialogoAbierto()) return;          // no mover nada mientras se cobra
  const r = await api(`pendientes?id_cafeteria=${idCaf}`);
  if (!r.ok || hayDialogoAbierto()) return;
  pendientes = r.pedidos;
  const ids = pendientes.map(p => p.id_pedido);
  if (pendientesVistos && ids.some(id => !pendientesVistos.includes(id))) campana();
  pendientesVistos = ids;
  const html = pendientes.map(p => `
    <div class="qr">
      <div class="cab"><span class="num">#${esc(p.numero_turno)}</span><span class="quien" title="${esc(p.cliente)}">${esc(p.cliente)}</span>
        <span class="chip ${p.minutos > 7 ? 'alerta' : ''}" title="Se cancela si no se cobra a tiempo (10 min; 20 en hora pico)">${Math.floor(Number(p.minutos) || 0)} min</span></div>
      <div class="items">${(p.items || []).map(i => `${esc(i.cantidad)}× ${esc(i.producto)}${i.observaciones ? ` <span class="nota">(${esc(i.observaciones)})</span>` : ''}`).join(', ')}</div>
      <button class="primario" style="font-size:1.1rem;font-weight:700;min-height:50px" data-cobrar="${esc(p.id_pedido)}">Cobrar ${pesos(p.valor_total)}</button>
    </div>`).join('');
  $('#sec-qr').classList.toggle('vacia', !pendientes.length);
  $('#sec-qr').classList.toggle('con-pedidos', !!pendientes.length);
  $('#n-pend').innerHTML = pendientes.length ? `<span class="n-pend">${pendientes.length}</span>` : '· ninguno por ahora ✓';
  if (html !== ultimoHtmlPend) { $('#pendientes').innerHTML = html; ultimoHtmlPend = html; }
}

$('#pendientes').addEventListener('click', e => {
  const b = e.target.closest('[data-cobrar]');
  if (!b || !sesion) return;
  const p = pendientes.find(x => x.id_pedido === b.dataset.cobrar);
  if (!p) return;
  dialogoCobro({
    titulo: 'Al cobrar pasa a cocina', detalle: `Turno <strong>#${esc(p.numero_turno)}</strong> · <strong>${esc(p.cliente)}</strong> · ${esc(p.canal)}`,
    total: p.valor_total, items: listaItems(p.items || [])
  }, async medio => {
    const a = await llamar('autorizar', { id_pedido: p.id_pedido, medio_pago: medio, ...firma() });
    if (a.ok) { aviso(`Turno ${a.numero_turno ?? p.numero_turno} · ${a.cliente ?? p.cliente} → enviado a cocina`); setTimeout(cargarPendientes, 0); }
    return a;
  });
});

// ---------------------------------------------------------------------
// Acciones secundarias: abandono de fila y reclamo
// ---------------------------------------------------------------------
$('#btn-se-va').onclick = () => {
  if (!sesion) return;
  const s = segundosEspera();
  const d = abrirDialogo(`<h2>¿El cliente se fue sin pedir?</h2>
    <p class="suave">Se registra para medir el abandono de la fila${llegada ? ` (esperó ${reloj(s)})` : ''}. El pedido en pantalla se vacía.</p>
    <div class="mensaje error oculto" id="msg-ab"></div>
    <div class="pie-dialogo"><button data-cerrar>No, volver</button><button class="primario" data-si>Sí, se fue</button></div>`);
  d.querySelector('[data-cerrar]').onclick = () => d.close();
  d.querySelector('[data-si]').onclick = async ev => {
    ev.target.disabled = true;
    const r = await llamar('abandono-fila', { id_cafeteria: Number(idCaf), ...firma(), segundos_espera: s });
    if (!r.ok) { ev.target.disabled = false; return mostrarMensaje(d.querySelector('#msg-ab'), r.mensaje); }
    d.close(); limpiar(); aviso('Abandono de fila registrado');
  };
};

const TIPOS_RECLAMO = ['Pedido incompleto', 'Pedido equivocado', 'Entregado a otra persona', 'Demora', 'Otro'];
$('#btn-reclamo').onclick = () => {
  if (!sesion) return;
  const d = abrirDialogo(`<h2>Registrar reclamo</h2>
    <form id="f-reclamo">
      <label for="r-pedido">¿De qué pedido? (los de hoy, el más reciente primero)</label>
      <select id="r-pedido" required><option value="">Cargando pedidos de hoy…</option></select>
      <label>¿Qué pasó?</label>
      <div class="fila-botones" id="r-tipos">${TIPOS_RECLAMO.map((t, i) => `<label class="check chip" style="margin:0;padding:8px 12px;min-height:44px;align-items:center">
        <input type="radio" name="r-tipo" value="${t}" ${i === 0 ? 'checked' : ''} style="margin:0"> ${t}</label>`).join('')}</div>
      <label for="r-desc">Detalle (opcional)</label>
      <input id="r-desc" maxlength="300">
      <label for="r-sol">Solución dada (opcional)</label>
      <input id="r-sol" maxlength="300" placeholder="Ej. se repuso el producto">
      <div class="mensaje error oculto" id="msg-reclamo"></div>
      <div class="pie-dialogo"><button type="button" data-cerrar>Cancelar</button><button class="primario">Guardar reclamo</button></div>
    </form>`);
  d.querySelector('[data-cerrar]').onclick = () => d.close();
  api(`pedidos-hoy?id_cafeteria=${idCaf}`).then(r => {
    const sel = d.querySelector('#r-pedido');
    const lista = r.ok ? r.pedidos : [];
    sel.innerHTML = lista.length
      ? `<option value="">Elige el pedido…</option>` + lista.map(x => `<option value="${esc(x.id_pedido)}">Turno ${esc(x.numero_turno)} · ${esc(x.cliente)} · ${esc(x.estado === 'Pagado' ? 'En cola' : x.estado)} · ${pesos(x.valor_total)}</option>`).join('')
      : `<option value="">No hay pedidos hoy</option>`;
    sel.focus();
  });
  d.querySelector('form').onsubmit = async ev => {
    ev.preventDefault();
    const id = d.querySelector('#r-pedido').value;
    if (!id) return mostrarMensaje(d.querySelector('#msg-reclamo'), 'Elige el pedido del reclamo.');
    const tipo = d.querySelector('input[name="r-tipo"]:checked').value;
    const btn = ev.submitter || d.querySelector('button.primario');
    btn.disabled = true;
    const r = await llamar('reclamo', { id_pedido: id, id_empleado: sesion.id_empleado, pin: sesion.pin, tipo_reclamo: tipo,
      descripcion: d.querySelector('#r-desc').value.trim() || tipo, solucion: d.querySelector('#r-sol').value.trim() });
    btn.disabled = false;
    if (!r.ok) return mostrarMensaje(d.querySelector('#msg-reclamo'), r.mensaje);
    d.close(); aviso(`Reclamo #${r.id_reclamo} guardado`);
  };
};

async function iniciar() {
  const cat = await cargarCatalogo(idCaf);
  llenarSelect($('#sel-caf'), cat.cafeterias.map(c => ({ value: c.id_cafeteria, label: c.nombre })), idCaf);
  if (cat.cafeterias.length < 2) $('#sel-caf').classList.add('oculto');
  productos = cat.productos; pintar(); cargarPendientes();
  sesion = await pedirIngreso('caja', idCaf, cat.empleados);
  $('#usuario').innerHTML = `${esc(sesion.nombre)} <button id="btn-salir">Salir</button>`;
  $('#btn-salir').onclick = () => cerrarSesion('caja', idCaf);
  pintar(); cargarPendientes();
}
$('#sel-caf').onchange = e => { location.search = `?cafeteria=${e.target.value}`; };
iniciar().catch(e => mostrarMensaje($('#msg-pedido'), e.message));
setInterval(cargarPendientes, 5000);
</script>
</body>
</html>
