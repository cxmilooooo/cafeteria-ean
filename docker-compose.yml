# Cafetería EAN · Gestión de pedidos con n8n
# Levantar todo:   docker compose up -d --build
name: cafeteria-ean

services:
  # Base de datos con el modelo entidad-relación del proyecto
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=America/Bogota"]
    environment:
      POSTGRES_DB: cafeteria
      POSTGRES_USER: cafeteria
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cafeteria2026}
      TZ: America/Bogota
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # solo desde este PC (Power BI o DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeteria -d cafeteria"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Motor de automatización: aquí viven los 13 flujos
  n8n:
    image: n8nio/n8n:2.46.7
    restart: unless-stopped
    entrypoint: ["tini", "--", "/bin/sh", "/init/iniciar-n8n.sh"]
    environment:
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      DB_PASSWORD: ${DB_PASSWORD:-cafeteria2026}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"    # los flujos leen TELEGRAM_* del entorno
      N8N_SECURE_COOKIE: "false"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none     # no guardar ejecuciones exitosas (llevan PIN y nombres)
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "48"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5679}/
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_CANAL_TURNOS: ${TELEGRAM_CANAL_TURNOS:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/init:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5679}:5678"   # el editor de n8n solo desde este PC; las páginas usan /api
    depends_on:
      postgres:
        condition: service_healthy

  # Páginas de cliente (QR), caja, cocina y pantalla de turnos
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - n8n

  # Dashboard de KPI en Python (Streamlit + Plotly)
  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cafeteria:${DB_PASSWORD:-cafeteria2026}@postgres:5432/cafeteria
      URL_PEDIDOS: ${URL_PUBLICA:-http://localhost:8080}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-coordinador2026}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"   # el dashboard solo desde este PC
    depends_on:
      postgres:
        condition: service_healthy

  # Respaldo automático cada 5 minutos (RPO 5 min); se guardan 24 horas
  respaldo:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: cafeteria
      PGDATABASE: cafeteria
      PGPASSWORD: ${DB_PASSWORD:-cafeteria2026}
      TZ: America/Bogota
    volumes:
      - ./respaldos:/respaldos
      - ./scripts/respaldo.sh:/respaldo.sh:ro
    entrypoint: ["/bin/sh", "/respaldo.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8n_data:
